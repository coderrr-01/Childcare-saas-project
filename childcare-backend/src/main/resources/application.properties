spring.application.name=childcare-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/childcare_dev
spring.datasource.username=postgres
spring.datasource.password=NewPassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Server
server.port=8080

# Authentication. Override CHILDCARE_JWT_SECRET with a 64+ character secret from the deployment secret manager.
childcare.security.jwt.secret=${CHILDCARE_JWT_SECRET:development-only-change-me-before-production-please-use-a-secret-manager-2026}
childcare.security.jwt.access-token-ttl=PT15M
childcare.security.jwt.refresh-token-ttl=P30D
